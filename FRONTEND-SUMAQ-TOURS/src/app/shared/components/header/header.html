<header class="site-header">

    <div class="header-container">

        <a routerLink="/" class="brand" aria-label="Sumaq Tours - Inicio">
            SUMAQ <span>TOURS</span>
        </a>

        <nav class="navigation" aria-label="Navegación principal">

            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                Inicio
            </a>

            <a routerLink="/nosotros" routerLinkActive="active">
                Nosotros
            </a>

            <a routerLink="/contacto" routerLinkActive="active">
                Contacto
            </a>

        </nav>

        <div class="auth-actions">

            <a mat-button routerLink="/login">
                Ingresar
            </a>

            <a mat-flat-button routerLink="/registro">
                Registrarse
            </a>

        </div>

    </div>

</header>
